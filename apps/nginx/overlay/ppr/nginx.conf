events {
    worker_connections   2000;

    # use [ kqueue | epoll | /dev/poll | select | poll ];
    use kqueue;
}


http {
	access_log /var/stdout;
	error_log /var/stderr;

	server {
		listen 80;

		server_name  _;

		location / {
			try_files $uri $uri /index.html;
			root /var/www/html;
		}
	}
}

